# Optional BACKUP scheduler for the payment tick (GET /api/cron/tick) and
# mailbox ingestion (GET /api/cron/ingest), every 5 minutes.
#
# The primary scheduler should be an external cron service calling both
# every 5 minutes (see docs/payments.md and docs/ingestion.md); Vercel Cron
# calls each once a day on the Hobby plan. GitHub runs scheduled workflows on
# a best-effort basis: runs can start late or be skipped when GitHub is busy,
# and stop after 60 days without repository activity. Do not rely on it alone.
#
# Each call does nothing until its repository secrets are set:
#   PAYMENT_TICK_URL   https://<your-project>.vercel.app/api/cron/tick
#   INGEST_URL         https://<your-project>.vercel.app/api/cron/ingest
#   CRON_SECRET        the same value as the CRON_SECRET in Vercel (at least 32 characters)
name: Scheduled ticks (backup)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Call the payment tick
        env:
          URL: ${{ secrets.PAYMENT_TICK_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "PAYMENT_TICK_URL or CRON_SECRET is not set: nothing to do."
            exit 0
          fi
          code=$(curl -sS -o response.json -w '%{http_code}' --max-time 70 -H "Authorization: Bearer $CRON_SECRET" "$URL")
          cat response.json; echo
          test "$code" = "200"

      # Runs even if the payment tick failed: one does not hold up the other.
      - name: Call mailbox ingestion
        if: ${{ always() }}
        env:
          URL: ${{ secrets.INGEST_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "INGEST_URL or CRON_SECRET is not set: nothing to do."
            exit 0
          fi
          code=$(curl -sS -o response.json -w '%{http_code}' --max-time 70 -H "Authorization: Bearer $CRON_SECRET" "$URL")
          cat response.json; echo
          test "$code" = "200"
