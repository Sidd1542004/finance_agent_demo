# Optional BACKUP scheduler for the payment tick (GET /api/cron/tick).
#
# The primary scheduler should be an external cron service calling the tick
# every 5 minutes (see docs/payments.md). GitHub runs scheduled workflows on a
# best-effort basis: runs can start late or be skipped when GitHub is busy,
# and stop after 60 days without repository activity. Do not rely on it alone.
#
# It does nothing until both repository secrets are set:
#   PAYMENT_TICK_URL   https://<your-project>.vercel.app/api/cron/tick
#   CRON_SECRET        the same value as the CRON_SECRET in Vercel
name: Payment tick (backup)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the tick
        env:
          URL: ${{ secrets.PAYMENT_TICK_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "PAYMENT_TICK_URL or CRON_SECRET is not set: nothing to do."
            exit 0
          fi
          code=$(curl -sS -o response.json -w '%{http_code}' --max-time 70 -H "Authorization: Bearer $CRON_SECRET" "$URL")
          cat response.json; echo
          test "$code" = "200"
