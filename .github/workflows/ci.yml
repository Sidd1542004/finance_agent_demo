name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix server
          npm ci --prefix client

      # No secrets needed. Most tests use the in-memory ledger; the route, payment and
      # ingestion tests start an in-memory MongoDB (mongodb-memory-server downloads
      # mongod on the first run).
      - name: Server tests
        run: npm test --prefix server

      # Plain functions behind the dashboard (no browser needed).
      - name: Client tests
        run: npm test --prefix client

      - name: Client build
        run: npm run build --prefix client

      - name: Format check
        run: npm run format:check
